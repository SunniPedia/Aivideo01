name: Render Video
on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme'
        required: true
        default: 'podcast'
        type: choice
        options:
          - podcast
          - infographic
          - both
      quality:
        description: 'Quality'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - full
      audio_volume:
        description: 'Audio volume'
        required: false
        default: '1.0'
      tail_seconds:
        description: 'Seconds after audio ends'
        required: false
        default: '2'
      start:
        description: 'Start time (test)'
        required: false
        default: ''
      end:
        description: 'End time (test)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-ui-core
          sudo fc-cache -f

      - name: Download SolaimanLipi if needed
        run: |
          if [ ! -f SolaimanLipi-Regular.ttf ]; then
            curl -L -o SolaimanLipi-Regular.ttf "https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.ttf" || echo "::warning::Could not download SolaimanLipi-Regular.ttf – upload manually"
            curl -L -o SolaimanLipi-Bold.ttf "https://fonts.maateen.me/solaiman-lipi/solaimanlipi-bold-v1.0.ttf" || echo "::warning::Could not download SolaimanLipi-Bold.ttf – upload manually"
          fi

      - name: npm install
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Static checks
        run: node tool-check-repo.js || true

      - name: Render podcast
        if: ${{ github.event.inputs.theme == 'podcast' || github.event.inputs.theme == 'both' }}
        env:
          THEME: podcast
          WIDTH: ${{ github.event.inputs.quality == 'full' && '1920' || '960' }}
          FPS: ${{ github.event.inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ github.event.inputs.audio_volume }}
          END_PAD: ${{ github.event.inputs.tail_seconds }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          OUT: video-podcast.mp4
        run: node render.js

      - name: Render infographic
        if: ${{ github.event.inputs.theme == 'infographic' || github.event.inputs.theme == 'both' }}
        env:
          THEME: infographic
          WIDTH: ${{ github.event.inputs.quality == 'full' && '1080' || '540' }}
          FPS: ${{ github.event.inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ github.event.inputs.audio_volume }}
          END_PAD: ${{ github.event.inputs.tail_seconds }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          OUT: video-infographic.mp4
        run: node render.js

      - name: Probe outputs
        run: |
          for f in video-*.mp4; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" || true
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video-*.mp4
          retention-days: 14

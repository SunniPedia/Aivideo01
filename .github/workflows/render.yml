name: Render Video
on:
  workflow_dispatch:
    inputs:
      theme:
        description: Theme
        type: choice
        options: [podcast, infographic, both]
        default: podcast
      quality:
        description: Quality
        type: choice
        options: [preview, full]
        default: preview
      audio_volume:
        description: Audio volume
        default: "1.0"
      tail_seconds:
        description: Tail after audio (seconds)
        default: "2"
      start:
        description: Start time for test render
        default: ""
      end:
        description: End time for test render
        default: ""
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra && fc-cache -f
      - name: Download Bengali font if missing
        run: |
          if [ ! -f SolaimanLipi-Regular.ttf ]; then curl -fL https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.ttf -o SolaimanLipi-Regular.ttf || { rm -f SolaimanLipi-Regular.ttf; echo '::warning::Upload SolaimanLipi-Regular.ttf manually if Bengali glyphs are missing'; }; fi
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tool-check-repo.js
      - name: Render requested themes
        env:
          THEME_INPUT: ${{ inputs.theme }}
          QUALITY: ${{ inputs.quality }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
          END_PAD: ${{ inputs.tail_seconds }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          if [ "$QUALITY" = full ]; then FPS=30; else FPS=15; fi
          if [ "$THEME_INPUT" = both ] || [ "$THEME_INPUT" = infographic ]; then THEME=infographic WIDTH=$([ "$QUALITY" = full ] && echo 1080 || echo 540) FPS=$FPS node render.js; fi
          if [ "$THEME_INPUT" = both ] || [ "$THEME_INPUT" = podcast ]; then THEME=podcast WIDTH=$([ "$QUALITY" = full ] && echo 1920 || echo 960) FPS=$FPS node render.js; fi
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video-*.mp4
          retention-days: 14
